name: CI Ronda 2

on:
  push:
    branches: [main]

env:
  IMAGE: saludo-app

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr tests
        working-directory: src
        run: pytest -v

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v9

      - name: Calcular versión
        id: ver
        run: echo "version=1.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Build imagen
        run: docker build -t $IMAGE:latest .

      - name: Probar imagen
        run: docker run --rm $IMAGE:latest

      - name: Guardar reporte
        run: |
          mkdir -p reporte
          docker run --rm $IMAGE:latest > reporte/salida.txt
          echo "Run número: ${{ github.run_number }}" >> reporte/salida.txt

      - name: Subir reporte
        uses: actions/upload-artifact@v4
        with:
          name: reporte-build
          path: reporte/

  report:
    name: Reporte final
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Verificar versión
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ -z "$VERSION" ]; then echo "ERROR: VERSION llegó vacía"; exit 1; fi
          echo "Versión: $VERSION"

      - name: Verificar secret
        env:
          MENSAJE: ${{ secrets.APP_MESSAGE }}
        run: |
          if [ -z "$MENSAJE" ]; then echo "ERROR: falta el secret APP_MESSAGE"; exit 1; fi
          echo "Secret configurado OK"

      - name: Descargar reporte
        uses: actions/download-artifact@v4
        with:
          name: reporte
          path: reporte/

      - name: Mostrar reporte
        run: cat reporte/salida.txt
